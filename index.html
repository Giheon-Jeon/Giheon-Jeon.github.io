  <div id="toast" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 bg-stone-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg z-50"></div>

  <script>
    document.getElementById("copyright").textContent = `© ${new Date().getFullYear()} 전기헌 Jeon GiHeon. All rights reserved.`;

    const toast = document.getElementById("toast");
    let toastTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("hidden"), 1800);
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.top = "-9999px";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch {
        ok = false;
      }
      document.body.removeChild(textarea);
      return ok;
    }

    async function copyText(text) {
      if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          // 모던 API가 막혀 있으면 아래 fallback으로 시도
        }
      }
      return fallbackCopy(text);
    }

    document.querySelectorAll(".email-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const email = btn.dataset.email;
        const success = await copyText(email);
        if (success) {
          showToast(`${email} 복사되었어요`);
        } else {
          showToast(`복사에 실패했어요. 직접 입력해주세요: ${email}`);
        }
      });
    });
  </script>
