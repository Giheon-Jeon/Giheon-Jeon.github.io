<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="description" content="전기헌의 링크 모음" />

<link rel="stylesheet" as="style" crossorigin

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          pretendard: ["Pretendard", "-apple-system", "BlinkMacSystemFont", "system-ui", "sans-serif"],
        },
      },
    },
  };
</script>

<style>
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .bg-warm-gradient {
    background: linear-gradient(160deg, #fdf6ec 0%, #f8e9d2 35%, #f3d9b8 70%, #eec89e 100%);
  }
  .link-card:active {
    transform: scale(0.98);
  }
  .email-btn:active {
    transform: scale(0.98);
  }
</style>

        class="w-24 h-24 rounded-full object-cover ring-4 ring-white shadow-md"
      />
      <div>
        <h1 class="text-lg font-bold text-stone-800">전기헌 Jeon GiHeon</h1>
        <p class="mt-1 text-sm text-stone-500 leading-relaxed">
          일상을 남깁니다 🌿<br />
          아래에서 제 다른 공간들을 만나보세요
        </p>
      </div>
    </section>

    <section class="flex flex-col gap-3">
      <a href="https://instagram.com/gyeon.rus" target="_blank" rel="noopener noreferrer"
         class="link-card flex items-center justify-center gap-2 w-full rounded-2xl bg-stone-800 text-white font-medium py-3.5 px-5 text-sm sm:text-base">
        📷 Instagram
      </a>
      <a href="https://blog.naver.com/jgh030814" target="_blank" rel="noopener noreferrer"
         class="link-card flex items-center justify-center gap-2 w-full rounded-2xl bg-white text-stone-800 font-medium py-3.5 px-5 text-sm sm:text-base ring-1 ring-stone-200">
        ✍️ 블로그
      </a>
      <a href="https://github.com/Giheon-Jeon" target="_blank" rel="noopener noreferrer"
         class="link-card flex items-center justify-center gap-2 w-full rounded-2xl bg-white text-stone-800 font-medium py-3.5 px-5 text-sm sm:text-base ring-1 ring-stone-200">
        💻 GitHub
      </a>

      <div class="flex gap-3">
        <button type="button" class="email-btn flex-1 flex items-center justify-center gap-1.5 rounded-2xl bg-white text-stone-800 font-medium py-3.5 px-3 text-xs sm:text-sm ring-1 ring-stone-200" data-email="jgh030814@gmail.com">
          ✉️ 개인 이메일 복사
        </button>
        <button type="button" class="email-btn flex-1 flex items-center justify-center gap-1.5 rounded-2xl bg-white text-stone-800 font-medium py-3.5 px-3 text-xs sm:text-sm ring-1 ring-stone-200" data-email="jgh030814@mju.ac.kr">
          🎓 학교 이메일 복사
        </button>
      </div>
    </section>

    <section class="flex flex-col items-center gap-4 pt-2 border-t border-stone-200">
      <div class="flex items-center gap-5 pt-4">
        <a href="https://instagram.com/gyeon.rus" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="text-stone-600">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">

          </svg>
        </a>
        <a href="https://github.com/Giheon-Jeon" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="text-stone-600">

          </svg>
        </a>
        <a href="mailto:jgh030814@gmail.com" aria-label="이메일" class="text-stone-600">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5">

          </svg>
        </a>
      </div>
      <p class="text-xs text-stone-400" id="copyright"></p>
    </section>
  </main>

  <div id="toast" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 bg-stone-800 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg z-50"></div>

  <script>
    document.getElementById("copyright").textContent = `© ${new Date().getFullYear()} 전기헌 Jeon GiHeon. All rights reserved.`;

    const toast = document.getElementById("toast");
    let toastTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("hidden"), 1800);
    }

    document.querySelectorAll(".email-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const email = btn.dataset.email;
        try {
          await navigator.clipboard.writeText(email);
          showToast(`${email} 복사되었어요`);
        } catch {
          showToast("복사에 실패했어요. 다시 시도해주세요.");
        }
      });
    });
  </script>
</body>
</html>
